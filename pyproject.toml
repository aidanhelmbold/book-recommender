[project]
name = "bookmap"
version = "0.1.0"
description = "A book recommendation network built from Goodreads similar-books and Amazon co-purchase graphs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.4",
    "pyarrow>=17",
    "numpy>=1.26",
    "scipy>=1.13",
    "networkx>=3.3",
    "python-igraph>=0.11",
    "leidenalg>=0.10",
    "rapidfuzz>=3.9",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
bookmap = "bookmap.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.112",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bookmap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "strict"
markers = [
    "slow: scale-sanity tests that build large synthetic graphs",
]
